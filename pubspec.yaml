name: mobile_flutter_template
description: Mobile Flutter Template's Overview
publish_to: none
version: 1.0.2+26

environment:
  sdk: '^3.12.0'
  flutter: '^3.50.0'

workspace:
  - modules/app_config
  - modules/bridge
  - modules/data_config
  - modules/message
  - modules/theme
  - shared/cc_core_sdk/cc_sdk
  - shared/cc_core_sdk/cc_sdk_ui
  - shared/cc_core_sdk/cc_mixin
  - shared/cc_core_sdk/cc_sdk_data
  - shared/cc_core_sdk/cc_sdk_catcher
  - shared/cc_core_sdk/cc_sdk_device
  - shared/cc_core_sdk/cc_sdk_firebase
  - shared/cc_core_sdk/cc_sdk_phone
  - shared/cc_core_sdk/cc_sdk_slack
  - cc_bridge
  - shared/cc_micro_features
  - modules/domain_features

dependencies:
  app_config:
    path: modules/app_config
  auto_route: ^11.1.0

  bridge:
    path: modules/bridge
  catcher_2: ^2.1.12
  cc_mixin:
    path: shared/cc_core_sdk/cc_mixin

  cc_bridge:
    path: cc_bridge
  cc_sdk_catcher:
    path: shared/cc_core_sdk/cc_sdk_catcher
  cc_sdk_data:
    path: shared/cc_core_sdk/cc_sdk_data
  cc_sdk_device:
    path: shared/cc_core_sdk/cc_sdk_device
  cc_sdk:
    path: shared/cc_core_sdk/cc_sdk
  cc_sdk_firebase:
    path: shared/cc_core_sdk/cc_sdk_firebase
  cc_sdk_phone:
    path: shared/cc_core_sdk/cc_sdk_phone
  cc_sdk_slack:
    path: shared/cc_core_sdk/cc_sdk_slack
  cc_sdk_ui:
    path: shared/cc_core_sdk/cc_sdk_ui

  data_config:
    path: modules/data_config

  easy_localization: ^3.0.8

  firebase_core: ^5.1.0
  firebase_performance: ^0.12.1
  firebase_remote_config: ^7.0.1

  cc_micro_features:
    path: shared/cc_micro_features

  domain_features:
    path: modules/domain_features
  flutter:
    sdk: flutter

  get: ^4.7.3
  get_it: ^9.2.1

  hive_ce: ^2.19.3
  injectable: ^3.0.0
  multiple_result: ^5.3.0

  message:
    path: modules/message
  path_provider: ^2.1.5
  provider: ^6.1.5+1

  theme:
    path: modules/theme

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  build_runner: ^2.15.1
  lint: ^2.8.0
  melos: ^8.10.0

dependency_overrides:
  # path_provider_android 2.3.x (jni-based) throws ClassNotFoundException
  # "Landroid/content/Context;" at startup (_bootHive ->
  # getApplicationDocumentsDirectory): its generated Context type has no
  # className, so jni looks up the descriptor "Landroid/content/Context;".
  # Pin the last pigeon-based release. Remove once upstream is fixed.
  path_provider_android: 2.2.17
  cli_util: ^0.5.0
  # auto_route_generator 10.6.0 (latest) caps analyzer <14, but Flutter 3.50's
  # pinned test_api forces test >=1.31.2 (analyzer 13-14) and hive_ce_generator
  # >=1.11.3 needs analyzer ^14. Upper bound: injectable_generator 3.1.3 ->
  # lean_builder 1.2.2 -> _fe_analyzer_shared <106 (analyzer <14.3). An override
  # ignores every other package's constraint, so keep it narrow and pin
  # build_runner to the last release that accepts analyzer <14.3 (2.16.2 needs
  # >=14.3). Remove both once auto_route_generator allows analyzer 14.
  analyzer: '>=14.0.0 <14.3.0'
  build_runner: 2.16.1
  # fluttertoast is NOT used by this project; it is only a transitive dependency
  # of catcher_2 (for its ToastHandler, which we never register). Upstream
  # 10.0.2 (latest) applies the Kotlin Gradle Plugin unconditionally and breaks
  # AGP 9 built-in Kotlin, so it is replaced by a Dart-only no-op stub with no
  # native code.
  fluttertoast:
    path: third_party/fluttertoast

flutter:
  uses-material-design: true

  # Avoid LLDB stopping on iOS's UIScene-lifecycle runtime-issue breakpoint
  # and freezing the app on launch (e.g. stuck on splash).
  config:
    enable-lldb-debugging: false

  # Bundled assets
  assets:
    - assets/icon/
    - assets/lottie/
    - assets/bg/
    - assets/legal/terms_of_service.html
    - assets/legal/privacy_policy.html

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F5F5F0"

flutter_native_splash:
  color: "#F5F5F0"
  image: assets/icon/app_icon.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/icon/app_icon.png
    color: "#F5F5F0"

# Single Source of Truth for workspace scripts: melos 8.10.0 reads scripts from
# this `melos.scripts` block (NOT from melos.yaml). Do not duplicate them in
# melos.yaml — duplication causes drift.
melos:
  scripts:
    gen:
      run: >
        melos exec -- "dart run build_runner build --delete-conflicting-outputs" &&
        dart run build_runner build --delete-conflicting-outputs
      description: Generate all code for all packages and root app.

    rebuild:
      run: >
        melos exec -- "flutter clean && flutter pub get && dart run build_runner build --delete-conflicting-outputs" &&
        dart run build_runner build --delete-conflicting-outputs
      description: Clean and rebuild all packages and root app.

    analyze:
      run: melos exec --concurrency=1 -- "flutter analyze --no-fatal-infos"
      description: Run analysis for all packages.

    test:
      run: melos exec --dir-exists="test" --concurrency=1 -- "flutter test"
      description: Run tests for all packages.

    check:imports:
      run: dart scripts/check_imports.dart
      description: >-
        Enforce import boundaries (AGENTS.md "VI. Enforcement"): SDK barrels
        only, no private src/ imports, state-agnostic and vendor-free SDK
        core, project-blind shared code, layer purity, no flutter_dotenv,
        no new package cycles.

    setup:firebase:
      run: bash scripts/setup_firebase_configs.sh
      description: Generate local config files from templates.

    run:prod:
      run: bash scripts/run_prod.sh
      description: >-
        Clean, pub get, codegen, then flutter run --flavor prod on a device.
        Pass a device id as an extra arg, else uses $DEVICE_ID or the
        script's default UDID.

    run:release:
      run: bash scripts/run_prod_release.sh
      description: >-
        Clean, pub get, codegen, then flutter run --release on a device
        (prod entry point). Same device resolution as run:prod (CLI arg, then
        $DEVICE_ID, then the script's default UDID).
