name: mobile_flutter_template
description: Mobile Flutter Template's Overview
publish_to: none
version: 1.0.0+1

environment:
  sdk: '^3.12.0'
  flutter: '>=3.41.9'

workspace:
  - modules/app_config
  - modules/data_config
  - modules/message
  - modules/theme
  - shared/cc_core_sdk/cc_sdk
  - shared/cc_core_sdk/cc_sdk_ui
  - shared/cc_core_sdk/cc_mixin
  - shared/cc_core_sdk/cc_sdk_data
  - cc_bridge
  - shared/cc_micro_features
  - modules/domain_features

dependencies:
  app_config:
    path: modules/app_config
  auto_route: ^11.1.0

  bloc: ^9.2.1
  catcher_2: ^2.1.9
  cc_mixin:
    path: shared/cc_core_sdk/cc_mixin

  cc_bridge:
    path: cc_bridge
  cc_sdk:
    path: shared/cc_core_sdk/cc_sdk
  cc_sdk_ui:
    path: shared/cc_core_sdk/cc_sdk_ui

  custom_refresh_indicator: ^4.0.1

  data_config:
    path: modules/data_config
  device_info_plus: ^13.1.0
  dio: ^5.9.2
  dio_smart_retry: ^7.0.1

  easy_localization: ^3.0.8
  equatable: ^2.0.8

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_messaging: ^16.4.1
  firebase_crashlytics: ^5.2.4
  firebase_performance: ^0.11.4+3
  firebase_app_check: ^0.4.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  cc_micro_features:
    path: shared/cc_micro_features

  domain_features:
    path: modules/domain_features
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_lints: ^6.0.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0

  get: ^4.7.3
  get_it: ^9.2.1

  google_fonts: ^8.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  injectable: ^3.0.0
  internet_connection_checker_plus: ^3.0.0
  intl: ^0.20.2
  country_code_picker: ^3.0.0
  phone_numbers_parser: ^9.0.23

  # Dart data class
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0

  loadmore: ^2.1.0
  logger: ^2.7.0
  lottie: ^3.3.3

  melos: 7.8.1
  message:
    path: modules/message
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1

  shared_preferences: ^2.5.5

  theme:
    path: modules/theme

  url_launcher: ^6.3.2
  uuid: ^4.5.3

  webview_flutter: ^4.13.1

dev_dependencies:
  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: 2.4.7
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  build_runner: ^2.15.0
  lint: ^2.8.0

flutter:
  uses-material-design: true

  # Environment files
  assets:
    - env/.env.development
    - env/.env.uat
    - env/.env.prod
    - assets/icon/
    - assets/lottie/

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"

flutter_native_splash:
  color: "#36454F"
  image: assets/icon/app_icon.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/icon/app_icon.png
    color: "#36454F"

melos:
  scripts:
    bootstrap:
      description: Bootstrap the workspace and download all dependencies.
      run: flutter pub get

    gen:
      description: Generate code for all packages and the root project.
      run: |
        melos exec --depends-on="build_runner" -- "flutter pub run build_runner build --delete-conflicting-outputs"
        flutter pub run build_runner build --delete-conflicting-outputs

    rebuild:
      description: Run bootstrap followed by code generation.
      run: flutter pub get && melos run gen && flutter pub run build_runner build --delete-conflicting-outputs

    analyze:
      description: Analyze all packages in the workspace.
      run: melos exec -- "flutter analyze"

    test:
      description: Run tests for all packages in the workspace.
      run: melos exec --dir-exists="test" -- "flutter test"

    setup:firebase:
      description: Initialize Firebase configuration files from templates.
      run: |
        cp android/app/src/free/google-services.json.template android/app/src/free/google-services.json
        cp android/app/src/prod/google-services.json.template android/app/src/prod/google-services.json
        cp android/app/src/uat/google-services.json.template android/app/src/uat/google-services.json
        cp ios/Firebase/free/GoogleService-Info.plist.template ios/Firebase/free/GoogleService-Info.plist
        cp ios/Firebase/prod/GoogleService-Info.plist.template ios/Firebase/prod/GoogleService-Info.plist
        cp ios/Firebase/uat/GoogleService-Info.plist.template ios/Firebase/uat/GoogleService-Info.plist
