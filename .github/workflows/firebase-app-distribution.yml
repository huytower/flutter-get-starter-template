name: CI/CD Pipeline

on:
  push:
    branches: [ qltc ]
  pull_request:
    branches: [ qltc ]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App flavor'
        required: true
        default: 'prod'
        type: choice
        options: [ prod ]

env:
  FLUTTER_VERSION: '3.44.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Quality Gate: Runs for all pushes, PRs, and workflow dispatches.
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
      - name: Lint & Test
        run: |
          melos run gen
          melos run analyze
          melos run test

  # 2. PR Smoke Test: Ensures the app still compiles on pull requests.
  pr-build-test:
    if: github.event_name == 'pull_request'
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          setup-java: 'true'
      - name: Generate Code
        run: melos run gen
      - name: Compile Check
        run: flutter build appbundle --release --flavor prod

  # 3. Android Deployment: Runs on push to main or workflow_dispatch.
  android-distribute:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/qltc')
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          setup-java: 'true'
          ruby-dir: 'android'
      
      - name: Prep Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Generate Code
        run: melos run gen

      - name: Fastlane Distribute
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}" > firebase_credentials.json
          cd android && bundle exec fastlane distribute_firebase flavor:${{ github.event.inputs.flavor || 'prod' }}
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_CREDENTIALS_PATH: ../firebase_credentials.json

  # 4. iOS Deployment: Runs on push to main or workflow_dispatch.
  ios-distribute:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/qltc')
    needs: quality-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          ruby-dir: 'ios'

      - name: Generate Code
        run: melos run gen

      - name: Fastlane TestFlight
        run: cd ios && bundle exec fastlane beta flavor:${{ github.event.inputs.flavor || 'prod' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
