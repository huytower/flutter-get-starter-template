name: CI/CD Pipeline

on:
  push:
    branches: [ qltc ]
  pull_request:
    branches: [ qltc ]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App flavor'
        required: true
        default: 'prod'
        type: choice
        options: [ prod ]

env:
  FLUTTER_VERSION: '3.44.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"'
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # 1. Quality Gate: Runs for all pushes, PRs, and workflow dispatches.
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
      - name: Lint & Test
        run: |
          melos run gen
          melos run analyze
          melos run test

  # 2. PR Smoke Test: Ensures the app still compiles on pull requests.
  pr-build-test:
    if: github.event_name == 'pull_request'
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          setup-java: 'true'
      - name: Generate Code
        run: melos run gen
      - name: Compile Check
        run: flutter build appbundle --release --flavor prod --no-tree-shake-icons

  # 3. Android Deployment: Runs on push to main or workflow_dispatch.
  android-distribute:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/qltc')
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          setup-java: 'true'
          ruby-dir: 'android'
      
      - name: Prep Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - << 'EOF'
          import base64
          import os

          encoded = os.environ['KEYSTORE_BASE64'].strip()
          encoded = ''.join(encoded.split())
          encoded += '=' * (-len(encoded) % 4)
          try:
              keystore = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f"KEYSTORE_BASE64 is not valid base64: {error}")
          if not keystore:
              raise SystemExit("KEYSTORE_BASE64 decoded to an empty file")
          with open('android/app/keystore.jks', 'wb') as keystore_file:
              keystore_file.write(keystore)
          EOF
          python3 - << 'EOF'
          import os
          lines = [
              f"storePassword={os.environ['STORE_PASSWORD']}",
              f"keyPassword={os.environ['KEY_PASSWORD']}",
              f"keyAlias={os.environ['KEY_ALIAS']}",
              "storeFile=keystore.jks",
          ]
          with open('android/key.properties', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          EOF
          keytool -list \
            -keystore android/app/keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            >/dev/null || {
              echo "The Android keystore was decoded, but KEYSTORE_PASSWORD, KEY_PASSWORD, or KEY_ALIAS does not match it." >&2
              echo "Replace the four Android signing secrets from one original keystore/key entry." >&2
              exit 1
            }

      - name: Generate Code
        run: melos run gen

      - name: Fastlane Distribute to Firebase
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          FIREBASE_SERVICE_CREDENTIALS_PATH: ../firebase_credentials.json
        run: |
          python3 -c "import os, json; creds = os.environ.get('FIREBASE_SERVICE_CREDENTIALS', '').strip(); open('firebase_credentials.json', 'w').write(creds); json.loads(creds)" || {
            echo "::error::FIREBASE_SERVICE_CREDENTIALS secret is missing, empty, or not a valid JSON string." >&2
            echo "Please ensure secret FIREBASE_SERVICE_CREDENTIALS in GitHub Settings is set to your Firebase Service Account JSON key." >&2
            exit 1
          }
          cd android && bundle exec fastlane distribute_firebase flavor:${{ github.event.inputs.flavor || 'prod' }}

      - name: Fastlane Upload to Google Play Console (Alpha)
        env:
          FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
        run: |
          cd android && bundle exec fastlane build_release flavor:${{ github.event.inputs.flavor || 'prod' }}

  # 4. iOS Deployment: Runs on push to main or workflow_dispatch.
  ios-distribute:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/qltc')
    needs: quality-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-api-key-android: ${{ secrets.GOOGLE_API_KEY_ANDROID }}
          google-api-key-ios: ${{ secrets.GOOGLE_API_KEY_IOS }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          slack-crash-webhook-url: ${{ secrets.SLACK_CRASH_WEBHOOK_URL }}
          slack-feedback-webhook-url: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
          gemini-model-name: ${{ secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          ruby-dir: 'ios'

      - name: Generate Code
        run: melos run gen

      - name: Clear iOS & Xcode Caches
        run: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/* || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

      - name: Fastlane TestFlight
        run: cd ios && bundle exec fastlane beta flavor:${{ github.event.inputs.flavor || 'prod' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
