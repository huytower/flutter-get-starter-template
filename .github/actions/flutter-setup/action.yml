name: 'Flutter Project Setup'
description: 'Standardized setup for Flutter, Melos, and Ruby'
inputs:
  flutter-version:
    description: 'Flutter version to use'
    required: true
  setup-java:
    description: 'Whether to setup Java'
    default: 'false'
  ruby-dir:
    description: 'Directory containing Gemfile'
    required: false
  google-api-key-android:
    description: 'Google API Key for Android'
    required: false
  google-api-key-ios:
    description: 'Google API Key for iOS'
    required: false
  firebase-project-id:
    description: 'Firebase Project ID'
    required: false
  slack-crash-webhook-url:
    description: 'Slack Webhook URL for Crash Reports'
    required: false
  slack-feedback-webhook-url:
    description: 'Slack Webhook URL for User Feedback'
    required: false
  is-force-update:
    description: 'Default for force app update ("true"/"false"); live value is Remote Config isForce'
    required: false
  minimum-os-version-has-force:
    description: 'Default minimum app version (semver, e.g. 1.2.0); live value is Remote Config minimumOsVersionHasForce'
    required: false
  gemini-model-name:
    description: 'Gemini Model Name'
    required: false
  app-vars-json:
    description: 'toJSON(vars): repository Variables. Only keys listed in env/prod.example.json are used.'
    required: false
    default: '{}'

runs:
  using: "composite"
  steps:
    - if: inputs.setup-java == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    # Required on: google_mlkit_* >= 1.0 are Swift Package Manager-only on iOS.
    - name: Enable Swift Package Manager
      shell: bash
      run: flutter config --enable-swift-package-manager

    - name: Setup Melos
      shell: bash
      run: |
        dart pub global activate melos ^8.10.0
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

    - name: Ensure Native Config Files Exist
      shell: bash
      run: |
        # Initialize native config files from templates to avoid "file not found" errors in CI
        find . -name "*.template" | while read -r template; do
          target="${template%.template}"
          if [ ! -f "$target" ]; then
            # Ensure target directory exists
            mkdir -p "$(dirname "$target")"
            cp "$template" "$target"
            echo "Created $target from template"
          fi
        done

    - name: Inject Native Config Secrets
      shell: bash
      # Secrets are passed through `env:` (never interpolated into the script
      # text), so values containing quotes/backticks cannot alter the shell.
      env:
        GOOGLE_API_KEY_ANDROID: ${{ inputs.google-api-key-android }}
        GOOGLE_API_KEY_IOS: ${{ inputs.google-api-key-ios }}
        FIREBASE_PROJECT_ID: ${{ inputs.firebase-project-id }}
      run: |
        # Only the native configs generated from *.template hold placeholders.
        # (Scanning the whole repo, submodules included, was slow and could
        # corrupt unrelated files.)
        files=()
        while IFS= read -r f; do files+=("$f"); done < <(
          find . -name '*.template' -not -path './.git/*' | sed 's/\.template$//' |
            while read -r f; do [ -f "$f" ] && echo "$f"; done
        )

        inject_secret() {
          local key=$1
          local placeholder_env=$2
          local val="${!key}"

          [ -n "$val" ] || return 0
          [ "${#files[@]}" -gt 0 ] || return 0
          echo "Injecting $key..."
          # Perl reads search/replace from the environment; \Q...\E makes the
          # match literal, so special characters in secrets are safe.
          SEARCH="$placeholder_env" REPLACE="$val" perl -pi -e 's/\Q$ENV{SEARCH}\E/$ENV{REPLACE}/g' "${files[@]}"
          SEARCH="{{$key}}" REPLACE="$val" perl -pi -e 's/\Q$ENV{SEARCH}\E/$ENV{REPLACE}/g' "${files[@]}"
        }

        inject_secret GOOGLE_API_KEY_ANDROID "YOUR_ANDROID_KEY_HERE"
        inject_secret GOOGLE_API_KEY_IOS "YOUR_IOS_KEY_HERE"
        inject_secret FIREBASE_PROJECT_ID "your-project-id"

    - name: Generate App Env (env/prod.json)
      shell: bash
      # GitHub is the single source of truth: Variables for non-secret values,
      # Secrets for secret ones (a Secret wins over a Variable of the same
      # name). Only keys listed in env/prod.example.json are written; a key
      # with no value is left out so the app's default in PrjEnv applies.
      # Values go through `env:`, never into the script text, and are never
      # printed — only key names are logged.
      env:
        APP_VARS_JSON: ${{ inputs.app-vars-json }}
        SLACK_CRASH_WEBHOOK_URL: ${{ inputs.slack-crash-webhook-url }}
        SLACK_FEEDBACK_WEBHOOK_URL: ${{ inputs.slack-feedback-webhook-url }}
        GEMINI_MODEL_NAME: ${{ inputs.gemini-model-name }}
        IS_FORCE_UPDATE: ${{ inputs.is-force-update }}
        MINIMUM_OS_VERSION_HAS_FORCE: ${{ inputs.minimum-os-version-has-force }}
      run: |
        python3 - <<'PY'
        import json, os

        with open('env/prod.example.json') as f:
            keys = list(json.load(f).keys())
        app_vars = json.loads(os.environ.get('APP_VARS_JSON') or '{}')
        secret_keys = {
            'SLACK_CRASH_WEBHOOK_URL', 'SLACK_FEEDBACK_WEBHOOK_URL',
            'GEMINI_MODEL_NAME', 'IS_FORCE_UPDATE', 'MINIMUM_OS_VERSION_HAS_FORCE',
        }

        out, sources = {}, {}
        for key in keys:
            value = (os.environ.get(key) or '').strip() if key in secret_keys else ''
            source = 'secret/input'
            if not value:
                value = str(app_vars.get(key) or '').strip()
                source = 'variable'
            if value:
                out[key] = value
                sources[key] = source

        with open('env/prod.json', 'w') as f:
            json.dump(out, f, indent=2)
        for key in keys:
            print(f"  {key}: {sources.get(key, 'default (PrjEnv)')}")
        PY

    - name: Bootstrap Workspace
      shell: bash
      run: melos bootstrap

    - if: inputs.ruby-dir != ''
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
        working-directory: ${{ inputs.ruby-dir }}
