org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
# AGP 9 enables optimized resource shrinking for release builds, which needs
# non-final R IDs (AGP's default since 8.0). The app's native code does not
# use R IDs as compile-time constants (no switch/case on R.*).
android.nonFinalResIds=true
# AGP 9 built-in Kotlin (Flutter >= 3.47). The app and all resolved plugins no
# longer apply the Kotlin Gradle Plugin themselves.
android.builtInKotlin=true
# Matches the Flutter 3.50 template: the Flutter Gradle Plugin and several
# plugins still use the legacy variant API.
android.newDsl=false
