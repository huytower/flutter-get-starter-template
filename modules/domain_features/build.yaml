targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        generate_for:
          include:
            - lib/**
        options:
          auto_register: true
          class_name_pattern:
            "Impl$|Helper$|DataSource$|Repository$|UseCase$|Bloc$|Controller$|Manager$"
          file_name_pattern:
            "_impl$|_helper$|_data_source$|_repository$|_use_case$|_bloc$|_controller$|_manager$"
      hive_ce_generator:hive_type_adapter_generator:
        generate_for:
          include:
            - lib/**
      hive_ce_generator:hive_adapters_generator:
        generate_for:
          include:
            - lib/**
