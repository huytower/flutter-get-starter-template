name: domain_features
description: A collection of business-specific micro-feature modules.
version: 1.0.0
publish_to: none

environment:
  sdk: '^3.12.0'

resolution: workspace

dependencies:
  cc_sdk:
    path: ../../shared/cc_core_sdk/cc_sdk
  cc_sdk_ui:
    path: ../../shared/cc_core_sdk/cc_sdk_ui
  cc_bridge:
    path: ../../cc_bridge
  cc_sdk_data:
    path: ../../shared/cc_core_sdk/cc_sdk_data
  cc_micro_features:
    path: ../../shared/cc_micro_features
  
  auto_route: ^11.1.0
  data_config:
    path: ../../modules/data_config
  message:
    path: ../../modules/message
  dio: ^5.9.2
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  get: ^4.7.3
  get_it: ^9.2.1
  hive_ce: ^2.12.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  multiple_result: ^5.3.0
  retrofit: ^4.9.2
  rxdart: ^0.28.0
  fl_chart: ^1.2.0

dev_dependencies:
  auto_route_generator: ^10.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.1
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true
