name: bridge
description: >-
  The App Shell's gateway to the app's features: shell contracts and the
  implementations of the cross-module coordinators.
version: 0.0.1
publish_to: none

environment:
  sdk: '^3.12.0'
  flutter: '^3.44.3'

resolution: workspace

dependencies:
  app_config:
    path: ../app_config
  auto_route: ^11.1.0
  cc_bridge:
    path: ../../cc_bridge
  cc_micro_features:
    path: ../../shared/cc_micro_features
  data_config:
    path: ../data_config
  domain_features:
    path: ../domain_features
  flutter:
    sdk: flutter
  get: ^4.7.3
  get_it: ^9.2.1
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
