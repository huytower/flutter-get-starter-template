name: mobile_flutter_template

packages:
  - modules/*
  - shared/cc_core_sdk/*
  - shared/cc_core_sdk/cc_mixin
  - shared/cc_core_sdk/cc_sdk_data

  - cc_bridge
  - shared/cc_core_sdk/cc_sdk_ui
  - shared/cc_core_sdk/cc_sdk

  - shared/cc_micro_features

# NOTE: Workspace scripts (bootstrap, gen, rebuild, analyze, test, setup:firebase,
# check:imports) are defined ONCE in the root `pubspec.yaml` `melos.scripts`
# block. melos 7.8.1 reads scripts from pubspec.yaml, not from this file, so
# scripts are intentionally NOT duplicated here to avoid drift.
